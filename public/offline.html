<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Offline · GymPlan</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #08090b; color: #f3f5f7;
    font-family: system-ui, -apple-system, sans-serif; }
  main { max-width: 26rem; margin: 0 auto; padding: calc(3rem + env(safe-area-inset-top)) 1rem 2rem; text-align: center; }
  .card { background: #121417; border: 1px solid #23272e; border-radius: 1.5rem; padding: 1.5rem; }
  h1 { font-size: 1.25rem; margin: .75rem 0 .5rem; }
  p { color: #8b93a1; line-height: 1.5; font-size: .95rem; }
  button { margin-top: 1rem; width: 100%; min-height: 48px; border: 0; border-radius: 1rem;
    background: #00e6a8; color: #000; font-weight: 700; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div style="font-size:2.5rem">📶</div>
    <h1>Gerade keine Verbindung</h1>
    <p>Diese Seite wurde noch nicht offline gespeichert. Ein laufendes Training
       ist auf dem Gerät gesichert — sobald wieder Netz da ist, geht's weiter.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</main>
</body>
</html>
